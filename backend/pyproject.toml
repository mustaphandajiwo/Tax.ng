[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxng"
version = "0.1.0"
description = "tax.ng Phase 1 demo: rules engine, calculators, legal library and Tax AI"
requires-python = ">=3.11"
license = { text = "Proprietary. Copyright 2026 Astound Innovation Hub. All rights reserved." }
dependencies = [
  "starlette>=0.37",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["taxng*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is left to the formatter

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
